<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Workout Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 40px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #timer-display {
      font-size: 5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 4px;
    }

    #next-beep {
      font-size: 1.2rem;
      color: #aaa;
      min-height: 1.5em;
      text-align: center;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 340px;
    }

    button {
      width: 100%;
      padding: 32px 20px;
      border: none;
      border-radius: 20px;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    #start-btn {
      background: #00c853;
      color: #000;
    }

    #stop-btn {
      background: #d50000;
      color: #fff;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button:disabled:active {
      transform: none;
    }

    #status {
      font-size: 1rem;
      color: #888;
      min-height: 1.2em;
    }

    /* Flash overlay */
    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s ease-in;
    }

    #flash.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="flash"></div>

  <h1>Workout Timer</h1>
  <div id="timer-display">0:00</div>
  <div id="next-beep"></div>

  <div class="buttons">
    <button id="start-btn" onclick="startTimer()">START</button>
    <button id="stop-btn" onclick="stopTimer()" disabled>STOP</button>
  </div>

  <div id="status"></div>

  <script>
    let intervalId = null;
    let elapsedSeconds = 0;
    let nextAlertAt = 60;
    let nextGap = 10;
    let wakeLock = null;

    // ── Wake Lock ──────────────────────────────────────────────────────────
    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }

    // Re-acquire wake lock if the page becomes visible again (e.g. after
    // the user switches back from another app mid-workout).
    document.addEventListener('visibilitychange', () => {
      if (intervalId !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    // ── Speech ─────────────────────────────────────────────────────────────
    // Prime speechSynthesis inside the tap gesture so iOS allows later calls.
    function primeSpeech() {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance('');
      u.volume = 0;
      speechSynthesis.speak(u);
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 1.0;
      u.pitch = 1.0;
      u.volume = 1.0;
      speechSynthesis.speak(u);
    }

    // ── Flash ──────────────────────────────────────────────────────────────
    function flash() {
      const el = document.getElementById('flash');
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 300);
    }

    // ── Alert (speech + flash together) ───────────────────────────────────
    function triggerAlert() {
      speak('interval');
      flash();
    }

    // ── Display ────────────────────────────────────────────────────────────
    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m + ':' + String(sec).padStart(2, '0');
    }

    function updateDisplay() {
      document.getElementById('timer-display').textContent = formatTime(elapsedSeconds);
      const remaining = nextAlertAt - elapsedSeconds;
      document.getElementById('next-beep').textContent =
        remaining > 0 ? 'Next alert in ' + remaining + 's' : '';
    }

    // ── Timer ──────────────────────────────────────────────────────────────
    function tick() {
      elapsedSeconds++;
      if (elapsedSeconds === nextAlertAt) {
        triggerAlert();
        nextAlertAt += nextGap;
        nextGap = nextGap === 10 ? 60 : 10;
      }
      updateDisplay();
    }

    function startTimer() {
      if (intervalId !== null) return;

      // Must prime speech inside the gesture handler
      primeSpeech();
      requestWakeLock();

      elapsedSeconds = 0;
      nextAlertAt = 60;
      nextGap = 10;

      document.getElementById('start-btn').disabled = true;
      document.getElementById('stop-btn').disabled = false;
      document.getElementById('status').textContent = 'Running…';
      updateDisplay();

      intervalId = setInterval(tick, 1000);
    }

    function stopTimer() {
      if (intervalId === null) return;
      clearInterval(intervalId);
      intervalId = null;
      speechSynthesis.cancel();
      releaseWakeLock();

      document.getElementById('start-btn').disabled = false;
      document.getElementById('stop-btn').disabled = true;
      document.getElementById('status').textContent = 'Stopped at ' + formatTime(elapsedSeconds);
      document.getElementById('next-beep').textContent = '';
    }
  </script>

</body>
</html>
